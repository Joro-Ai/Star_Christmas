<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz mo no 5</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .pregame-message-container {
            background: linear-gradient(145deg, #5e4b8b, #f6a1c0);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 4px 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease-in-out;
            width: 400px;
            font-size: 18px;
            color: #fff;
            font-weight: bold;
            position: relative;
        }

        .pregame-message-container:hover {
            transform: scale(1.05);
        }

        .pregame-message-container h1 {
            font-size: 32px;
            margin-bottom: 15px;
            font-family: 'Impact', sans-serif;
            color: #fff;
        }

        .pregame-message-container p {
            margin: 0;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .pregame-message-container button {
            padding: 15px 40px;
            background-color: #fff;
            border: none;
            border-radius: 12px;
            color: #5e4b8b;
            font-size: 20px;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }

        .pregame-message-container button:hover {
            background-color: #5e4b8b;
            color: white;
        }

        .game-container {
            display: none;
            margin-top: 20px;
        }

        .sudoku-container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        table {
            border-collapse: collapse;
        }

        td {
            width: 40px;
            height: 40px;
            text-align: center;
            vertical-align: middle;
            border: 1px solid #ddd;
            font-size: 18px;
        }

        input {
            width: 100%;
            height: 100%;
            font-size: 18px;
            text-align: center;
            border: none;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border: 1px solid #007BFF;
        }

        .game-buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 12px;
            background-color: #007BFF;
            color: white;
            border: none;
            transition: background-color 0.3s ease, transform 0.2s;
        }

        button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

        .clear-btn {
            background-color: #e0e0e0;
            color: #333;
        }

        .clear-btn:hover {
            background-color: #b0b0b0;
        }
    </style>
</head>
<body>
    <div>
        <div id="pregame-message" class="pregame-message-container">
            <h1>Sudoku Game</h1>
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Sudoku_Puzzle_by_L2G-20050714_standardized_layout.svg/230px-Sudoku_Puzzle_by_L2G-20050714_standardized_layout.svg.png" alt="Sudoku Logo" style="width: 80px; margin-bottom: 20px;">
            <p>Last but not least, mahal ang paborito mo goodluckk!!</p>
            <button onclick="startGame()">Start Game</button>
        </div>

        <div class="game-container" id="game-container">
            <div class="sudoku-container">
                <table id="sudoku-grid"></table>
            </div>
            <div class="game-buttons">
                <button onclick="checkSolution()">Check Solution</button>
                <button class="clear-btn" onclick="clearGrid()">Clear Grid</button>
            </div>
        </div>
    </div>

    <script>
        const sudokuGrid = [
            [5, 3, 0, 0, 7, 0, 0, 0, 0],
            [6, 0, 0, 1, 9, 5, 0, 0, 0],
            [0, 9, 8, 0, 0, 0, 0, 6, 0],
            [8, 0, 0, 0, 6, 0, 0, 0, 3],
            [4, 0, 0, 8, 0, 3, 0, 0, 1],
            [7, 0, 0, 0, 2, 0, 0, 0, 6],
            [0, 6, 0, 0, 0, 0, 2, 8, 0],
            [0, 0, 0, 4, 1, 9, 0, 0, 5],
            [0, 0, 0, 0, 8, 0, 0, 7, 9]
        ];

        function startGame() {
            document.getElementById("pregame-message").style.display = "none";
            document.getElementById("game-container").style.display = "block";
            createGrid();
        }

        function createGrid() {
            const table = document.getElementById("sudoku-grid");

            for (let i = 0; i < 9; i++) {
                const row = document.createElement("tr");
                for (let j = 0; j < 9; j++) {
                    const cell = document.createElement("td");

                    if (sudokuGrid[i][j] !== 0) {
                        cell.textContent = sudokuGrid[i][j];
                    } else {
                        const input = document.createElement("input");
                        input.type = "number";
                        input.min = 1;
                        input.max = 9;
                        input.setAttribute("data-row", i);
                        input.setAttribute("data-col", j);
                        cell.appendChild(input);
                    }

                    row.appendChild(cell);
                }
                table.appendChild(row);
            }
        }

        function checkSolution() {
            let isCorrect = true;
            let errorMessage = "";

            for (let row = 0; row < 9; row++) {
                const seen = new Set();
                for (let col = 0; col < 9; col++) {
                    const input = document.querySelector(`input[data-row="${row}"][data-col="${col}"]`);
                    const value = input ? input.value : sudokuGrid[row][col];
                    if (value) {
                        const numValue = parseInt(value);
                        if (isNaN(numValue) || numValue < 1 || numValue > 9 || seen.has(numValue)) {
                            isCorrect = false;
                            errorMessage = "There is an invalid number or duplicate.";
                            break;
                        }
                        seen.add(numValue);
                    } else {
                        isCorrect = false;
                        errorMessage = "There are empty cells.";
                        break;
                    }
                }
                if (!isCorrect) break;
            }

            if (isCorrect) {
                for (let col = 0; col < 9; col++) {
                    const seen = new Set();
                    for (let row = 0; row < 9; row++) {
                        const input = document.querySelector(`input[data-row="${row}"][data-col="${col}"]`);
                        const value = input ? input.value : sudokuGrid[row][col];
                        if (value) {
                            const numValue = parseInt(value);
                            if (isNaN(numValue) || numValue < 1 || numValue > 9 || seen.has(numValue)) {
                                isCorrect = false;
                                errorMessage = "There is an invalid number or duplicate in columns.";
                                break;
                            }
                            seen.add(numValue);
                        } else {
                            isCorrect = false;
                            errorMessage = "There are empty cells in columns.";
                            break;
                        }
                    }
                    if (!isCorrect) break;
                }
            }

            if (isCorrect) {
                for (let rowStart = 0; rowStart < 9; rowStart += 3) {
                    for (let colStart = 0; colStart < 9; colStart += 3) {
                        const seen = new Set();
                        for (let i = rowStart; i < rowStart + 3; i++) {
                            for (let j = colStart; j < colStart + 3; j++) {
                                const input = document.querySelector(`input[data-row="${i}"][data-col="${j}"]`);
                                const value = input ? input.value : sudokuGrid[i][j];
                                if (value) {
                                    const numValue = parseInt(value);
                                    if (isNaN(numValue) || numValue < 1 || numValue > 9 || seen.has(numValue)) {
                                        isCorrect = false;
                                        errorMessage = "There is an invalid number or duplicate in subgrids.";
                                        break;
                                    }
                                    seen.add(numValue);
                                } else {
                                    isCorrect = false;
                                    errorMessage = "There are empty cells in subgrids.";
                                    break;
                                }
                            }
                            if (!isCorrect) break;
                        }
                        if (!isCorrect) break;
                    }
                    if (!isCorrect) break;
                }
            }

            if (isCorrect) {
                window.location.href = "mot6congratulations.html";
            } else {
                alert(errorMessage);
            }
        }

        function clearGrid() {
            const inputs = document.querySelectorAll("input");
            inputs.forEach(input => input.value = "");
        }
    </script>
</body>
</html>
